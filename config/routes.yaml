controllers:
    prefix: 
        en: /en
        ru: /
        lv: /lv
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

app_admin:
    path: /{_locale}/admin
    controller: App\Controller\Admin\DashboardController
    defaults: { _locale: 'ru' }
    requirements:
        _locale: en|ru|lv